<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | JetShark</title>

  <!-- Шрифты -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Стили -->
  <link rel="stylesheet" href="contacto.css" />
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="img/logo.png" alt="JetShark Logo" />
      <span class="logo-text">JetShark</span>
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="modelos.html">Modelos</a>
      <a href="reservar.html">Reservar</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
  </header>

  <section class="contact-container">
    <!-- Левая колонка -->
    <div class="contact-form">
      <h2>Contacta con nosotros</h2>
      <p class="sub-text">Aquí estamos para ayudarte, no tengas miedo</p>

      <form>
        <label>Nombre</label>
        <input type="text" placeholder="Tu nombre" />

        <label>Email</label>
        <input type="email" placeholder="Tu correo electrónico" />

        <label>Teléfono</label>
        <input type="tel" placeholder="Tu número de teléfono" />

        <label>Mensaje</label>
        <textarea placeholder="Escribe tu mensaje" rows="5"></textarea>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>

    <!-- Правая колонка -->
    <div class="contact-map">
      <h3>Donde estamos</h3>
      <iframe class="map" src="https://www.google.com/maps?q=Miami&output=embed" allowfullscreen="" loading="lazy"></iframe>

      <div class="contact-info">
        <h3>Contactos</h3>

        <div class="contact-item">
          <img src="img/telefono.svg" alt="Teléfono" />
          <p><strong>Móvil:</strong> +1-555-123-4567</p>
        </div>

        <div class="contact-item">
          <img src="img/mail.svg" alt="Email" />
          <p><strong>Email:</strong> info@jetshark.com</p>
        </div>

        <div class="contact-item">
          <img src="img/maps.svg" alt="Dirección" />
          <p><strong>Dirección:</strong> 123 Ocean Drive, Miami, FL 33139</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
