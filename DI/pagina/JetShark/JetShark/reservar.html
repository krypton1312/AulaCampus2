<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar | JetShark</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="img/logo.png" alt="JetShark Logo">
      <span class="logo-text">JetShark</span>
    </div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="modelos.html">Modelos</a>
      <a href="reservar.html">Reservar</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <section class="form-container">
    <form>
      <h2>Reserva tu JetSki</h2>
      <input type="text" placeholder="Nombre">
      <input type="tel" placeholder="Teléfono">
      <input type="email" placeholder="Correo">
      <select>
        <option>Seleccionar Modelo de JetSki</option>
      </select>
      <input type="date">
      <input type="time">
      <input type="number" placeholder="Duración (horas)">
      <button>Reservar Ahora</button>
    </form>

    <img src="img/moto1.svg" alt="Moto de agua">
  </section>

      <footer>
        <div class="footer-top">
            <p>Dirección: Calle Falsa 123, Ciudad, País</p>
            <p>Teléfono: +1-555-123-4567</p>
            <p>Correo electrónico: info@jetshark.com</p>
        </div>

        <div class="footer-icons">
            <a href="#"><img src="img/instagram.svg" alt="Instagram"></a>
            <a href="#"><img src="img/facebook.svg" alt="Facebook"></a>
            <a href="#"><img src="img/youtube.svg" alt="YouTube"></a>
        </div>

        <div class="footer-bottom">
            <p>© 2025 JetShark. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
